<!DOCTYPE html>

<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>職業ガチャバトルカード｜ガチャ</title>

<style>

*{

  box-sizing:border-box;

}

body{

  margin:0;

  min-height:100vh;

  font-family:

    -apple-system,

    BlinkMacSystemFont,

    "Hiragino Sans",

    "Yu Gothic",

    sans-serif;

  background:

    radial-gradient(

      circle at top,

      #332000 0%,

      #111 35%,

      #050505 100%

    );

  color:#fff;

}

.wrap{

  width:min(92%,620px);

  margin:auto;

  padding:45px 0 60px;

}

.title{

  text-align:center;

  font-size:30px;

  font-weight:900;

  color:#f4cf70;

  margin-bottom:28px;

}

.box{

  background:rgba(15,15,15,.94);

  border:1px solid #7a5a24;

  border-radius:20px;

  padding:24px;

}

button{

  width:100%;

  border:none;

  border-radius:14px;

  padding:18px;

  font-size:19px;

  font-weight:900;

  cursor:pointer;

  margin-top:12px;

}

#gachaButton{

  background:

    linear-gradient(

      135deg,

      #8a4c00,

      #f2c14e,

      #8a4c00

    );

  color:#111;

}

#copyButton{

  display:none;

  background:#fff;

  color:#111;

}

#topButton{

  display:none;

  background:#262626;

  color:#fff;

  border:1px solid #555;

}

.message{

  text-align:center;

  margin:20px 0;

  min-height:55px;

  line-height:1.7;

}

.ready{

  color:#f4cf70;

  font-size:21px;

  font-weight:900;

}

.note{

  margin-top:22px;

  color:#888;

  text-align:center;

  font-size:12px;

  line-height:1.6;

}

#debug{

  display:none;

  white-space:pre-wrap;

}

</style>

</head>

<body>

<div class="wrap">

  <div class="title">

    職業ガチャバトルカード

  </div>

  <div class="box">

    <div class="message" id="message">

      運命の1枚を引け。

    </div>

    <button id="gachaButton">

      🎲 ガチャを引く

    </button>

    <button id="copyButton">

      📋 プロンプトをコピー

    </button>

    <button id="topButton">

      ← ガチャTOPへ戻る

    </button>

    <div class="note">

      このページでは1回だけ抽選できます。<br>

      もう一度引く場合はTOPへ戻ってください。

    </div>

    <div id="debug"></div>

  </div>

</div>

<script>

const API_URL =

  "https://ai-gacha-api.shiro-lab-base.workers.dev";

function createPrompt(result){

return `【職業ガチャバトルカード】

添付された人物写真またはキャラクター画像を使用してください。

人物名・キャラクター名は生成・表示しないでください。

以下は外部ガチャで抽選済みの固定結果です。

変更・再抽選・交換・再配分・数値補正をせず、そのまま使用してください。

ID：${result.id}

職業：${result.job}

レアリティ：${result.rarity}

HP：${result.stats["HP"]}

攻撃力：${result.stats["攻撃力"]}

防御力：${result.stats["防御力"]}

魔力：${result.stats["魔力"]}

速さ：${result.stats["速さ"]}

運：${result.stats["運"]}

魅力：${result.stats["魅力"]}

職業イメージとステータスが矛盾していても、その結果を個体差としてそのまま採用してください。

ステータスが極端に低い、高い、または大きく偏っていても修正しないでください。

添付された人物またはキャラクターを、元の特徴が分かる状態を保ちながら、抽選された職業のバトルキャラクターとして再構築してください。

固有スキルと必殺技は、職業とステータスを反映して作成してください。

効果は対戦でそのまま判定できるよう、ダメージ、回復、ステータス増減、効果ターン数、対象数、使用回数、発動条件、状態異常、クールダウン、代償などを、曖昧表現ではなく具体的な数値で設定してください。

確率やランダム性を含む効果は、％表記ではなく6面ダイス（D6）の出目で判定してください。

単純な発動判定は「1D6で4以上なら発動」のように表現してください。

ランダム効果は「1〜2：効果A、3〜4：効果B、5：効果C、6：効果D」のような出目分岐も使用できます。

固定ダメージ、固定回復、ステータス増減、効果ターン数など、確率を必要としない効果にはダイスを使用しないでください。

ダイス判定は必要な効果にだけ使用し、過剰に多用しないでください。

固有スキル：

常時効果または条件発動効果。

対戦中にそのまま処理できる明確な効果を1〜3個設定してください。

必殺技：

1回の行動として処理できる明確な技にしてください。

カードは豪華なファンタジーTCG風デザインにしてください。

レイアウト：

・左上：職業名を縦書き

・右上：レアリティ

・中央：人物またはキャラクター

・左下：HP / 攻撃力 / 防御力 / 魔力 / 速さ / 運 / 魅力

・右下：固有スキル / 必殺技

・右下の最下部に、ID「${result.id}」を小さな英数字のみで表示してください。専用の大きな装飾枠は作らず、カードフレーム内に自然に収めてください。

・外周：金属的な金装飾、彫刻模様、宝石を使った重厚なファンタジーカードフレーム

人物またはキャラクターは棒立ちではなく、職業・能力・戦闘スタイルが伝わるアクション中の姿にしてください。

市販トレーディングカードとして印刷できる63×88mm比率を基準にしてください。

カード外周には裁断用の黒い塗り足し領域を設け、重要な文字・数値・装飾は裁断位置から十分内側に配置してください。

説明や分析は出力せず、最終画像だけを生成してください。`;

}

let currentPrompt = "";

const gachaButton =

  document.getElementById("gachaButton");

const copyButton =

  document.getElementById("copyButton");

const topButton =

  document.getElementById("topButton");

const message =

  document.getElementById("message");

const debug =

  document.getElementById("debug");

if(

  sessionStorage.getItem("battleRolled") === "1"

){

  gachaButton.style.display =

    "none";

  copyButton.style.display =

    "block";

  topButton.style.display =

    "block";

  currentPrompt =

    sessionStorage.getItem("battlePrompt") || "";

  message.innerHTML =

    '<span class="ready">ガチャ完了！</span><br>結果はカードが完成してからのお楽しみ。';

}

gachaButton.addEventListener(

  "click",

  async () => {

    if(

      sessionStorage.getItem("battleRolled") === "1"

    ){

      return;

    }

    gachaButton.disabled = true;

    try{

      const response =

        await fetch(

          API_URL + "/roll",

          {

            method:"POST"

          }

        );

      const data =

        await response.json();

      if(

        !response.ok ||

        !data.success ||

        !data.result

      ){

        throw new Error(

          data.error || "ガチャに失敗しました"

        );

      }

      const result =

        data.result;

      currentPrompt =

        createPrompt(result);

      sessionStorage.setItem(

        "battlePrompt",

        currentPrompt

      );

      sessionStorage.setItem(

        "battleRolled",

        "1"

      );

      message.innerHTML =

        '<span class="ready">ガチャ完了！</span><br>結果はカードが完成してからのお楽しみ。';

      gachaButton.style.display =

        "none";

      copyButton.style.display =

        "block";

      topButton.style.display =

        "block";

      debug.textContent =

`ID：${result.id}

職業：${result.job}

レアリティ：${result.rarity}

HP：${result.stats["HP"]}

攻撃力：${result.stats["攻撃力"]}

防御力：${result.stats["防御力"]}

魔力：${result.stats["魔力"]}

速さ：${result.stats["速さ"]}

運：${result.stats["運"]}

魅力：${result.stats["魅力"]}`;

    }

    catch(error){

      console.error(error);

      message.textContent =

        "ガチャの通信に失敗しました。";

      gachaButton.disabled =

        false;

    }

  }

);

copyButton.addEventListener(

  "click",

  async () => {

    currentPrompt =

      sessionStorage.getItem(

        "battlePrompt"

      ) || currentPrompt;

    if(!currentPrompt){

      return;

    }

    try{

      await navigator.clipboard.writeText(

        currentPrompt

      );

      copyButton.textContent =

        "✓ コピーしました";

    }

    catch{

      const textarea =

        document.createElement(

          "textarea"

        );

      textarea.value =

        currentPrompt;

      document.body.appendChild(

        textarea

      );

      textarea.select();

      document.execCommand(

        "copy"

      );

      textarea.remove();

      copyButton.textContent =

        "✓ コピーしました";

    }

  }

);

topButton.addEventListener(

  "click",

  () => {

    sessionStorage.removeItem(

      "battleRolled"

    );

    sessionStorage.removeItem(

      "battlePrompt"

    );

    location.href =

      "index.html";

  }

);

</script>

</body>

</html>
