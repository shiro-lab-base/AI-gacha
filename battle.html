<!DOCTYPE html>

<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>職業ガチャバトルカード｜ガチャ</title>

<style>

*{

  box-sizing:border-box;

}

body{

  margin:0;

  min-height:100vh;

  font-family:

    -apple-system,

    BlinkMacSystemFont,

    "Hiragino Sans",

    "Yu Gothic",

    sans-serif;

  background:

    radial-gradient(

      circle at top,

      #332000 0%,

      #111 35%,

      #050505 100%

    );

  color:#fff;

}

.wrap{

  width:min(92%,620px);

  margin:auto;

  padding:45px 0 60px;

}

.title{

  text-align:center;

  font-size:30px;

  font-weight:900;

  color:#f4cf70;

  margin-bottom:28px;

}

.box{

  background:rgba(15,15,15,.94);

  border:1px solid #7a5a24;

  border-radius:20px;

  padding:24px;

}

button{

  width:100%;

  border:none;

  border-radius:14px;

  padding:18px;

  font-size:19px;

  font-weight:900;

  cursor:pointer;

  margin-top:12px;

}

#gachaButton{

  background:

    linear-gradient(

      135deg,

      #8a4c00,

      #f2c14e,

      #8a4c00

    );

  color:#111;

}

#copyButton{

  display:none;

  background:#fff;

  color:#111;

}

#topButton{

  display:none;

  background:#262626;

  color:#fff;

  border:1px solid #555;

}

.message{

  text-align:center;

  margin:20px 0;

  min-height:55px;

  line-height:1.7;

}

.ready{

  color:#f4cf70;

  font-size:21px;

  font-weight:900;

}

.note{

  margin-top:22px;

  color:#888;

  text-align:center;

  font-size:12px;

  line-height:1.6;

}

#debug{

  display:none;

  white-space:pre-wrap;

}

</style>

</head>

<body>

<div class="wrap">

  <div class="title">

    職業ガチャバトルカード

  </div>

  <!-- 後で広告を入れるならこの辺 -->

  <div class="box">

    <div class="message" id="message">

      運命の1枚を引け。

    </div>

    <button id="gachaButton">

      🎲 ガチャを引く

    </button>

    <button id="copyButton">

      📋 プロンプトをコピー

    </button>

    <button id="topButton">

      ← ガチャTOPへ戻る

    </button>

    <div class="note">

      このページでは1回だけ抽選できます。<br>

      もう一度引く場合はTOPへ戻ってください。

    </div>

    <div id="debug"></div>

  </div>

</div>

<script>

/* ==================================================

   職業

================================================== */

const JOBS = [

  "勇者",

  "剣士",

  "魔法使い",

  "僧侶",

  "アサシン",

  "狩人",

  "黒騎士",

  "召喚士",

  "バーサーカー",

  "ネクロマンサー",

  "錬金術師",

  "竜騎士",

  "呪術師",

  "賢者",

  "聖女",

  "吟遊詩人",

  "踊り子",

  "遊び人"

];

const HIDDEN_JOBS = [

  "魔王",

  "王様",

  "村の老人",

  "無職",

  "神"

];

const STAT_NAMES = [

  "HP",

  "攻撃力",

  "防御力",

  "魔力",

  "速さ",

  "運",

  "魅力"

];

/* ==================================================

   乱数

================================================== */

function randomUint32(){

  const array =

    new Uint32Array(1);

  crypto.getRandomValues(array);

  return array[0];

}

function randomFloat(){

  return randomUint32() / 4294967296;

}

function randomInt(min,max){

  return Math.floor(

    randomFloat() * (max-min+1)

  ) + min;

}

function choice(array){

  return array[

    randomInt(

      0,

      array.length-1

    )

  ];

}

/* ==================================================

   通常ステータス抽選

   1〜4           0.5%

   5〜9           2.5%

   10〜24        50.0%

   25〜49        30.0%

   50〜99        10.0%

   100〜299       6.0%

   300〜999       0.8%

   1000〜9999     0.15%

   10000〜9999999 0.05%

================================================== */

function normalStat(){

  const r =

    randomFloat();

  if(r < 0.005){

    return randomInt(

      1,

      4

    );

  }

  if(r < 0.030){

    return randomInt(

      5,

      9

    );

  }

  if(r < 0.530){

    return randomInt(

      10,

      24

    );

  }

  if(r < 0.830){

    return randomInt(

      25,

      49

    );

  }

  if(r < 0.930){

    return randomInt(

      50,

      99

    );

  }

  if(r < 0.990){

    return randomInt(

      100,

      299

    );

  }

  if(r < 0.998){

    return randomInt(

      300,

      999

    );

  }

  if(r < 0.9995){

    return randomInt(

      1000,

      9999

    );

  }

  /*

    超ジャックポット

    0.05%

  */

  return randomInt(

    10000,

    9999999

  );

}

/* ==================================================

   極みザコ

   カード全体イベント

   発生率 0.1%

   名称はプロンプトに出さない。

================================================== */

function createExtremeWeakStats(){

  const stats = {};

  for(

    const name

    of STAT_NAMES

  ){

    stats[name] =

      randomInt(

        1,

        5

      );

  }

  const weakCount =

    randomInt(

      1,

      2

    );

  const shuffled =

    [...STAT_NAMES]

      .sort(

        () => randomFloat() - 0.5

      );

  for(

    let i=0;

    i<weakCount;

    i++

  ){

    stats[

      shuffled[i]

    ] = randomInt(

      0,

      1

    );

  }

  return stats;

}

/* ==================================================

   極みぶっ壊れ

   カード全体イベント

   発生率 0.1%

   全ステ最低300。

   さらに1〜3項目を大幅強化。

   名称はプロンプトに出さない。

================================================== */

function createExtremeBrokenStats(){

  const stats = {};

  for(

    const name

    of STAT_NAMES

  ){

    stats[name] =

      randomInt(

        300,

        999

      );

  }

  const brokenCount =

    randomInt(

      1,

      3

    );

  const shuffled =

    [...STAT_NAMES]

      .sort(

        () => randomFloat() - 0.5

      );

  for(

    let i=0;

    i<brokenCount;

    i++

  ){

    const name =

      shuffled[i];

    const r =

      randomFloat();

    if(r < 0.70){

      stats[name] =

        randomInt(

          1000,

          9999

        );

    }

    else if(r < 0.95){

      stats[name] =

        randomInt(

          10000,

          999999

        );

    }

    else{

      stats[name] =

        randomInt(

          1000000,

          9999999

        );

    }

  }

  return stats;

}

/* ==================================================

   職業抽選

   隠し職合計 0.5%

================================================== */

function rollJob(){

  if(

    randomFloat() < 0.005

  ){

    return choice(

      HIDDEN_JOBS

    );

  }

  return choice(

    JOBS

  );

}

/* ==================================================

   レアリティ

================================================== */

function getRarity(stats){

  const values =

    Object.values(stats);

  const total =

    values.reduce(

      (a,b) => a+b,

      0

    );

  const max =

    Math.max(

      ...values

    );

  if(

    max >= 1000000

  ){

    return "♾️";

  }

  if(

    max >= 10000

  ){

    return "XR";

  }

  if(

    max >= 1000

  ){

    return "LR";

  }

  if(

    max >= 750 ||

    total >= 1300

  ){

    return "UR";

  }

  if(

    max >= 350 ||

    total >= 650

  ){

    return "SSR";

  }

  if(

    max >= 100 ||

    total >= 300

  ){

    return "SR";

  }

  if(

    total < 140 &&

    max < 40

  ){

    return "N";

  }

  return "R";

}

/* ==================================================

   ガチャ本体

   極みぶっ壊れ 0.1%

   極みザコ     0.1%

   通常         99.8%

================================================== */

function rollGacha(){

  const job =

    rollJob();

  const specialRoll =

    randomFloat();

  let stats;

  if(

    specialRoll < 0.001

  ){

    stats =

      createExtremeBrokenStats();

  }

  else if(

    specialRoll < 0.002

  ){

    stats =

      createExtremeWeakStats();

  }

  else{

    stats = {};

    for(

      const name

      of STAT_NAMES

    ){

      stats[name] =

        normalStat();

    }

  }

  const rarity =

    getRarity(

      stats

    );

  return {

    job,

    rarity,

    stats

  };

}

/* ==================================================

   ChatGPT用プロンプト

================================================== */

function createPrompt(result){

return `【職業ガチャバトルカード】

添付された人物写真またはキャラクター画像を使用してください。

人物名・キャラクター名は生成・表示しないでください。

以下は外部ガチャで抽選済みの固定結果です。

変更・再抽選・交換・再配分・数値補正をせず、そのまま使用してください。

職業：${result.job}

レアリティ：${result.rarity}

HP：${result.stats["HP"]}

攻撃力：${result.stats["攻撃力"]}

防御力：${result.stats["防御力"]}

魔力：${result.stats["魔力"]}

速さ：${result.stats["速さ"]}

運：${result.stats["運"]}

魅力：${result.stats["魅力"]}

職業イメージとステータスが矛盾していても、その結果を個体差としてそのまま採用してください。

ステータスが極端に低い、高い、または大きく偏っていても修正しないでください。

添付された人物またはキャラクターを、元の特徴が分かる状態を保ちながら、抽選された職業のバトルキャラクターとして再構築してください。

固有スキルと必殺技は、職業とステータスの高低・偏りを反映して作成してください。

効果は、対戦でそのまま判定できる具体的なゲーム効果にしてください。

「大ダメージ」

「高確率」

「能力が上昇する」

などの曖昧な表現だけで終わらせず、可能な限り以下を具体的に数値化してください。

・ダメージ量

・回復量

・上昇または低下するステータス値

・上昇または低下する割合

・効果ターン数

・発動確率

・対象数

・使用回数

・発動条件

・状態異常

・クールダウン

・代償

固有スキル：

常時効果または条件発動効果。

対戦中にそのまま処理できる明確な効果を1〜3個設定してください。

必殺技：

1回の行動として処理できる明確な技にしてください。

ダメージ、回復、バフ、デバフ、状態異常、追加行動、クールダウン、代償などを必要に応じて具体的な数値で設定してください。

ステータスの中に極端に高い値または極端に低い値がある場合は、その偏りを固有スキルまたは必殺技の効果に自然に反映してください。

ただし、元のステータス値そのものを変更・補正してはいけません。

カードは縦長の豪華なファンタジーTCG風デザインにしてください。

レイアウト：

・左上：職業名を縦書き

・右上：レアリティ

・中央：人物またはキャラクター

・左下：HP / 攻撃力 / 防御力 / 魔力 / 速さ / 運 / 魅力

・右下：固有スキル / 必殺技

・外周：金属的な金装飾、彫刻模様、宝石を使った重厚なファンタジーカードフレーム

人物またはキャラクターは棒立ちではなく、職業・能力・戦闘スタイルが伝わるアクション中の姿にしてください。

説明や分析は出力せず、最終画像だけを生成してください。`;

}

/* ==================================================

   画面

================================================== */

let currentPrompt =

  "";

const gachaButton =

  document.getElementById(

    "gachaButton"

  );

const copyButton =

  document.getElementById(

    "copyButton"

  );

const topButton =

  document.getElementById(

    "topButton"

  );

const message =

  document.getElementById(

    "message"

  );

const debug =

  document.getElementById(

    "debug"

  );

/* ==================================================

   すでに抽選済みか確認

================================================== */

if(

  sessionStorage.getItem(

    "battleRolled"

  ) === "1"

){

  gachaButton.style.display =

    "none";

  copyButton.style.display =

    "block";

  topButton.style.display =

    "block";

  currentPrompt =

    sessionStorage.getItem(

      "battlePrompt"

    ) || "";

  message.innerHTML =

    '<span class="ready">ガチャ完了！</span><br>結果はカードが完成してからのお楽しみ。';

}

/* ==================================================

   ガチャボタン

================================================== */

gachaButton.addEventListener(

  "click",

  () => {

    if(

      sessionStorage.getItem(

        "battleRolled"

      ) === "1"

    ){

      return;

    }

    const result =

      rollGacha();

    currentPrompt =

      createPrompt(

        result

      );

    sessionStorage.setItem(

      "battlePrompt",

      currentPrompt

    );

    sessionStorage.setItem(

      "battleRolled",

      "1"

    );

    message.innerHTML =

      '<span class="ready">ガチャ完了！</span><br>結果はカードが完成してからのお楽しみ。';

    gachaButton.style.display =

      "none";

    copyButton.style.display =

      "block";

    topButton.style.display =

      "block";

    debug.textContent =

`職業：${result.job}

レアリティ：${result.rarity}

HP：${result.stats["HP"]}

攻撃力：${result.stats["攻撃力"]}

防御力：${result.stats["防御力"]}

魔力：${result.stats["魔力"]}

速さ：${result.stats["速さ"]}

運：${result.stats["運"]}

魅力：${result.stats["魅力"]}`;

  }

);

/* ==================================================

   プロンプトコピー

================================================== */

copyButton.addEventListener(

  "click",

  async () => {

    currentPrompt =

      sessionStorage.getItem(

        "battlePrompt"

      ) || currentPrompt;

    if(

      !currentPrompt

    ){

      return;

    }

    try{

      await navigator.clipboard.writeText(

        currentPrompt

      );

      copyButton.textContent =

        "✓ コピーしました";

    }

    catch{

      const textarea =

        document.createElement(

          "textarea"

        );

      textarea.value =

        currentPrompt;

      document.body.appendChild(

        textarea

      );

      textarea.select();

      document.execCommand(

        "copy"

      );

      textarea.remove();

      copyButton.textContent =

        "✓ コピーしました";

    }

  }

);

/* ==================================================

   TOPへ戻る

================================================== */

topButton.addEventListener(

  "click",

  () => {

    sessionStorage.removeItem(

      "battleRolled"

    );

    sessionStorage.removeItem(

      "battlePrompt"

    );

    location.href =

      "index.html";

  }

);

</script>

</body>

</html>
