<!DOCTYPE html>

<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>職業ガチャバトルカード｜ガチャ</title>

<style>

*{

  box-sizing:border-box;

}

body{

  margin:0;

  min-height:100vh;

  font-family:

    -apple-system,

    BlinkMacSystemFont,

    "Hiragino Sans",

    "Yu Gothic",

    sans-serif;

  background:

    radial-gradient(

      circle at top,

      #332000 0%,

      #111 35%,

      #050505 100%

    );

  color:#fff;

}

.wrap{

  width:min(92%,620px);

  margin:auto;

  padding:45px 0 60px;

}

.title{

  text-align:center;

  font-size:30px;

  font-weight:900;

  color:#f4cf70;

  margin-bottom:28px;

}

.box{

  background:rgba(15,15,15,.94);

  border:1px solid #7a5a24;

  border-radius:20px;

  padding:24px;

}

button{

  width:100%;

  border:none;

  border-radius:14px;

  padding:18px;

  font-size:19px;

  font-weight:900;

  cursor:pointer;

  margin-top:12px;

}

#gachaButton{

  background:

    linear-gradient(

      135deg,

      #8a4c00,

      #f2c14e,

      #8a4c00

    );

  color:#111;

}

#copyButton{

  display:none;

  background:#fff;

  color:#111;

}

#topButton{

  display:none;

  background:#262626;

  color:#fff;

  border:1px solid #555;

}

.message{

  text-align:center;

  margin:20px 0;

  min-height:55px;

  line-height:1.7;

}

.ready{

  color:#f4cf70;

  font-size:21px;

  font-weight:900;

}

.note{

  margin-top:22px;

  color:#888;

  text-align:center;

  font-size:12px;

  line-height:1.6;

}

#debug{

  display:none;

  white-space:pre-wrap;

}

</style>

</head>

<body>

<div class="wrap">

  <div class="title">

    職業ガチャバトルカード

  </div>

  <div class="box">

    <div class="message" id="message">

      運命の1枚を引け。

    </div>

    <button id="gachaButton">

      🎲 ガチャを引く

    </button>

    <button id="copyButton">

      📋 プロンプトをコピー

    </button>

    <button id="topButton">

      ← ガチャTOPへ戻る

    </button>

    <div class="note">

      このページでは1回だけ抽選できます。<br>

      もう一度引く場合はTOPへ戻ってください。

    </div>

    <div id="debug"></div>

  </div>

</div>

<script>

const JOBS = [

  "勇者",

  "剣士",

  "魔法使い",

  "魔術師",

  "僧侶",

  "暗殺者",

  "狩人",

  "黒騎士",

  "召喚士",

  "狂戦士",

  "死霊使い",

  "錬金術師",

  "竜騎士",

  "呪術師",

  "賢者",

  "聖女",

  "吟遊詩人",

  "踊り子",

  "遊び人",

  "聖騎士",

  "忍者",

  "銃射手",

  "海賊",

  "拳闘士",

  "薬師",

  "探偵",

  "執事",

  "侍女",

  "軍人",

  "盗賊",

  "バニーガール",

  "獣使い",

  "侍"

];

const HIDDEN_JOBS = [

  "魔王",

  "王様",

  "村の老人",

  "無職",

  "神",

  "宇宙人"

];

const STAT_NAMES = [

  "HP",

  "攻撃力",

  "防御力",

  "魔力",

  "速さ",

  "運",

  "魅力"

];

function randomUint32(){

  const array = new Uint32Array(1);

  crypto.getRandomValues(array);

  return array[0];

}

function randomFloat(){

  return randomUint32() / 4294967296;

}

function randomInt(min,max){

  return Math.floor(

    randomFloat() * (max - min + 1)

  ) + min;

}

function choice(array){

  return array[

    randomInt(0,array.length - 1)

  ];

}

function generateResultId(){

  const chars =

    "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

  let id = "";

  for(let i=0; i<8; i++){

    id += chars[

      randomInt(0, chars.length - 1)

    ];

  }

  return (

    id.slice(0,4) +

    "-" +

    id.slice(4,8)

  );

}

function normalStat(){

  const r = randomFloat();

  if(r < 0.005){

    return randomInt(1,4);

  }

  if(r < 0.030){

    return randomInt(5,9);

  }

  if(r < 0.530){

    return randomInt(10,24);

  }

  if(r < 0.830){

    return randomInt(25,49);

  }

  if(r < 0.930){

    return randomInt(50,99);

  }

  if(r < 0.990){

    return randomInt(100,299);

  }

  if(r < 0.998){

    return randomInt(300,999);

  }

  if(r < 0.9995){

    return randomInt(1000,9999);

  }

  return randomInt(10000,9999999);

}

function createExtremeWeakStats(){

  const stats = {};

  for(const name of STAT_NAMES){

    stats[name] = randomInt(1,5);

  }

  const weakCount = randomInt(1,2);

  const shuffled =

    [...STAT_NAMES].sort(

      () => randomFloat() - 0.5

    );

  for(let i=0; i<weakCount; i++){

    stats[shuffled[i]] = randomInt(0,1);

  }

  return stats;

}

function createExtremeBrokenStats(){

  const stats = {};

  for(const name of STAT_NAMES){

    stats[name] = randomInt(300,999);

  }

  const brokenCount = randomInt(1,3);

  const shuffled =

    [...STAT_NAMES].sort(

      () => randomFloat() - 0.5

    );

  for(let i=0; i<brokenCount; i++){

    const name = shuffled[i];

    const r = randomFloat();

    if(r < 0.70){

      stats[name] = randomInt(1000,9999);

    }

    else if(r < 0.95){

      stats[name] = randomInt(10000,999999);

    }

    else{

      stats[name] = randomInt(1000000,9999999);

    }

  }

  return stats;

}

function rollJob(){

  if(randomFloat() < 0.005){

    return choice(HIDDEN_JOBS);

  }

  return choice(JOBS);

}

function getRarity(stats){

  const values = Object.values(stats);

  const total =

    values.reduce(

      (a,b) => a + b,

      0

    );

  const max =

    Math.max(...values);

  if(max >= 1000000){

    return "♾️";

  }

  if(max >= 10000){

    return "XR";

  }

  if(max >= 1000){

    return "LR";

  }

  if(max >= 750 || total >= 1300){

    return "UR";

  }

  if(max >= 350 || total >= 650){

    return "SSR";

  }

  if(max >= 100 || total >= 300){

    return "SR";

  }

  if(total < 140 && max < 40){

    return "N";

  }

  return "R";

}

function rollGacha(){

  const job = rollJob();

  const resultId =

    generateResultId();

  const specialRoll =

    randomFloat();

  let stats;

  if(specialRoll < 0.001){

    stats =

      createExtremeBrokenStats();

  }

  else if(specialRoll < 0.002){

    stats =

      createExtremeWeakStats();

  }

  else{

    stats = {};

    for(const name of STAT_NAMES){

      stats[name] = normalStat();

    }

  }

  const rarity =

    getRarity(stats);

  return {

    resultId,

    job,

    rarity,

    stats

  };

}

function createPrompt(result){

return `【職業ガチャバトルカード】

添付された人物写真またはキャラクター画像を使用してください。

人物名・キャラクター名は生成・表示しないでください。

以下は外部ガチャで抽選済みの固定結果です。

変更・再抽選・交換・再配分・数値補正をせず、そのまま使用してください。

ID：${result.resultId}

職業：${result.job}

レアリティ：${result.rarity}

HP：${result.stats["HP"]}

攻撃力：${result.stats["攻撃力"]}

防御力：${result.stats["防御力"]}

魔力：${result.stats["魔力"]}

速さ：${result.stats["速さ"]}

運：${result.stats["運"]}

魅力：${result.stats["魅力"]}

職業イメージとステータスが矛盾していても、その結果を個体差としてそのまま採用してください。

ステータスが極端に低い、高い、または大きく偏っていても修正しないでください。

添付された人物またはキャラクターを、元の特徴が分かる状態を保ちながら、抽選された職業のバトルキャラクターとして再構築してください。

固有スキルと必殺技は、職業とステータスを反映して作成してください。

効果は対戦でそのまま判定できるよう、ダメージ、回復、ステータス増減、効果ターン数、対象数、使用回数、発動条件、状態異常、クールダウン、代償などを、曖昧表現ではなく具体的な数値で設定してください。

確率やランダム性を含む効果は、％表記ではなく6面ダイス（D6）の出目で判定してください。

単純な発動判定は「1D6で4以上なら発動」のように表現してください。

ランダム効果は「1〜2：効果A、3〜4：効果B、5：効果C、6：効果D」のような出目分岐も使用できます。

固定ダメージ、固定回復、ステータス増減、効果ターン数など、確率を必要としない効果にはダイスを使用しないでください。

ダイス判定は必要な効果にだけ使用し、過剰に多用しないでください。

固有スキル：

常時効果または条件発動効果。

対戦中にそのまま処理できる明確な効果を1〜3個設定してください。

必殺技：

1回の行動として処理できる明確な技にしてください。

カードは豪華なファンタジーTCG風デザインにしてください。

レイアウト：

・左上：職業名を縦書き

・右上：レアリティ

・中央：人物またはキャラクター

・左下：HP / 攻撃力 / 防御力 / 魔力 / 速さ / 運 / 魅力

・右下：固有スキル / 必殺技

・右下の最下部に、ID「${result.resultId}」を小さな英数字のみで表示してください。専用の大きな装飾枠は作らず、カードフレーム内に自然に収めてください。

・外周：金属的な金装飾、彫刻模様、宝石を使った重厚なファンタジーカードフレーム

人物またはキャラクターは棒立ちではなく、職業・能力・戦闘スタイルが伝わるアクション中の姿にしてください。

市販トレーディングカードとして印刷できる63×88mm比率を基準にしてください。

カード外周には裁断用の黒い塗り足し領域を設け、重要な文字・数値・装飾は裁断位置から十分内側に配置してください。

説明や分析は出力せず、最終画像だけを生成してください。`;

}

let currentPrompt = "";

const gachaButton =

  document.getElementById("gachaButton");

const copyButton =

  document.getElementById("copyButton");

const topButton =

  document.getElementById("topButton");

const message =

  document.getElementById("message");

const debug =

  document.getElementById("debug");

if(

  sessionStorage.getItem(

    "battleRolled"

  ) === "1"

){

  gachaButton.style.display =

    "none";

  copyButton.style.display =

    "block";

  topButton.style.display =

    "block";

  currentPrompt =

    sessionStorage.getItem(

      "battlePrompt"

    ) || "";

  message.innerHTML =

    '<span class="ready">ガチャ完了！</span><br>結果はカードが完成してからのお楽しみ。';

}

gachaButton.addEventListener(

  "click",

  () => {

    if(

      sessionStorage.getItem(

        "battleRolled"

      ) === "1"

    ){

      return;

    }

    const result =

      rollGacha();

    currentPrompt =

      createPrompt(result);

    sessionStorage.setItem(

      "battlePrompt",

      currentPrompt

    );

    sessionStorage.setItem(

      "battleRolled",

      "1"

    );

    message.innerHTML =

      '<span class="ready">ガチャ完了！</span><br>結果はカードが完成してからのお楽しみ。';

    gachaButton.style.display =

      "none";

    copyButton.style.display =

      "block";

    topButton.style.display =

      "block";

    debug.textContent =

`ID：${result.resultId}

職業：${result.job}

レアリティ：${result.rarity}

HP：${result.stats["HP"]}

攻撃力：${result.stats["攻撃力"]}

防御力：${result.stats["防御力"]}

魔力：${result.stats["魔力"]}

速さ：${result.stats["速さ"]}

運：${result.stats["運"]}

魅力：${result.stats["魅力"]}`;

  }

);

copyButton.addEventListener(

  "click",

  async () => {

    currentPrompt =

      sessionStorage.getItem(

        "battlePrompt"

      ) || currentPrompt;

    if(!currentPrompt){

      return;

    }

    try{

      await navigator.clipboard.writeText(

        currentPrompt

      );

      copyButton.textContent =

        "✓ コピーしました";

    }

    catch{

      const textarea =

        document.createElement(

          "textarea"

        );

      textarea.value =

        currentPrompt;

      document.body.appendChild(

        textarea

      );

      textarea.select();

      document.execCommand(

        "copy"

      );

      textarea.remove();

      copyButton.textContent =

        "✓ コピーしました";

    }

  }

);

topButton.addEventListener(

  "click",

  () => {

    sessionStorage.removeItem(

      "battleRolled"

    );

    sessionStorage.removeItem(

      "battlePrompt"

    );

    location.href =

      "index.html";

  }

);

</script>

</body>

</html>
